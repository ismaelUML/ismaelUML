name: Metrics
on:
  # Schedule daily updates at midnight UTC
  schedule: [{cron: "0 0 * * *"}]
  # Allows manual runs from the GitHub Actions tab
  workflow_dispatch:
  # Run automatically on push to main
  push: {branches: ["main"]}

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Base metrics (Header, Repositories, Calendar)
      - name: Personal metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ismaelUML
          template: classic
          config_timezone: America/Argentina/Buenos_Aires
          config_order: base.header, isocalendar, base.repositories, followup
          config_padding: 10%
          base: "header, repositories"
          commits_authoring: ismaelUML, IvanCR48, cardozoivanismael@gmail.com
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_lines: yes
          plugin_followup: yes

      # Step 2: Deep dive metrics (Languages, Habits, Stars, Topics)
      - name: Personal metrics (additional)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.additional.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ismaelUML
          template: classic
          config_timezone: America/Argentina/Buenos_Aires
          config_order: habits, languages, stargazers, topics
          config_padding: 10%
          base: ""
          commits_authoring: ismaelUML, IvanCR48, cardozoivanismael@gmail.com
          plugin_habits: yes
          plugin_habits_from: 100
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_stargazers: yes
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_limit: 15
